[project]
name = "vera-aegis"
version = "0.1.0"
description = "Context-bound authorization for simulated incident response"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
claude = ["claude-agent-sdk==0.2.185"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aegis", "scenarios"]

[tool.setuptools.package-data]
aegis = ["web/*.html", "web/*.js", "web/*.css", "web/vendor/*"]
scenarios = ["*.json", "schemas/*.json"]

[project.scripts]
vera-aegis = "aegis.__main__:main"
