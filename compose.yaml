name: vera-aegis
services:
  aegis:
    build:
      context: .
      args:
        WITH_CLAUDE: ${WITH_CLAUDE:-0}
    environment:
      AEGIS_PORT: ${AEGIS_PORT:-8765}
      AEGIS_CLAUDE_MODEL: ${AEGIS_CLAUDE_MODEL:-sonnet}
      AEGIS_CLAUDE_MAX_BUDGET_USD: ${AEGIS_CLAUDE_MAX_BUDGET_USD:-1}
      AEGIS_CLAUDE_MAX_TURNS: ${AEGIS_CLAUDE_MAX_TURNS:-18}
      AEGIS_CLAUDE_MAX_TOOL_CALLS: ${AEGIS_CLAUDE_MAX_TOOL_CALLS:-30}
      AEGIS_CLAUDE_MAX_TOKENS: ${AEGIS_CLAUDE_MAX_TOKENS:-30000}
      AEGIS_CLAUDE_TIMEOUT_SECONDS: ${AEGIS_CLAUDE_TIMEOUT_SECONDS:-180}
      AEGIS_EXTERNAL_MCP_CONFIG: ${AEGIS_EXTERNAL_MCP_CONFIG:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:${AEGIS_PORT:-8765}:${AEGIS_PORT:-8765}"
    volumes:
      - aegis-state:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  aegis-state:
